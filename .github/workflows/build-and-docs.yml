# Benchmark only: no deployment or production workflow changes.
name: Benchmark narrow shared imports
run-name: Narrow imports / cache=${{ inputs.use_cache }} / shared-change=${{ inputs.shared_change }}
on:
  workflow_dispatch:
    inputs:
      shards:
        type: choice
        options: ['1', '4']
        default: '1'
        description: Number of problem build jobs
      use_cache:
        type: boolean
        default: false
        description: Restore the preceding successful cold run's project cache
      shared_change:
        type: boolean
        default: false
        description: Change a shared module docstring after restoring the base cache
permissions:
  contents: read
jobs:
  single:
    name: Single-job Lean validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Get Mathlib cache
        run: lake exe cache get
      - name: Restore project cache
        if: inputs.use_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lean-narrow-bench-20260909-${{ inputs.shards }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            lean-narrow-bench-20260909-${{ inputs.shards }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
          fail-on-cache-miss: true
      - name: Apply shared-module benchmark edit
        if: inputs.shared_change
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('FormalConjecturesForMathlib/Combinatorics/SimpleGraph/Ramsey.lean')
          s = p.read_text()
          old = '# Ramsey-type properties of graph pairs'
          assert old in s
          p.write_text(s.replace(old, old + ' (CI benchmark)', 1))
          PYCODE
      - name: Generate import aggregates
        run: |
          ./scripts/mk_all_formathlib.sh
          rm -f FormalConjectures/All.lean
          lake exe mk_all --lib FormalConjectures || true
          mv FormalConjectures.lean FormalConjectures/All.lean
          echo "set_option linter.style.moduleDocstring false" >> FormalConjectures/All.lean
      - name: Build shared libraries and tests
        run: |
          python3 scripts/lake-build-wrapper.py /tmp/shared.json lake --wfail build FormalConjecturesForMathlib FormalConjecturesUtil
          lake --wfail test
      - name: Validate all problems and declaration collisions
        run: python3 scripts/lake-build-wrapper.py /tmp/problems.json lake --wfail build
      - name: Validate categories
        run: |
          rm -f FormalConjectures/All.lean
          mkdir -p site/data
          lake exe extract_names --exclude=statement,docstring,moduleDocstrings,fileFirstAdded,fileLastModified > site/data/conjectures.json
          python3 scripts/check_category_warnings.py site/data/conjectures.json
      - name: Save validated project cache
        if: '!inputs.use_cache && !inputs.shared_change'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lean-narrow-bench-20260909-${{ inputs.shards }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
