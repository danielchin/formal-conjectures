# Benchmark only: production fix is on codex/ci-cache-before-docs.
---
name: Benchmark Lean cache boundary
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-latest
    name: Test scripts
    steps:
    - name: Checkout project
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: 3.12.9
    - name: Run script tests
      run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
    - name: Run website post-processing tests
      run: python3 -m unittest discover -s site -p 'test_*.py' -v
  build:
    runs-on: ubuntu-latest
    name: Build project
    steps:
    - name: Checkout project
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Detect build mode
      id: mode
      env:
        BENCHMARK_MODE: "${{ inputs.mode }}"
      run: |
        echo "website_only=false" >> "$GITHUB_OUTPUT"
        if [[ "$BENCHMARK_MODE" == seed ]]; then
          echo "site=true" >> "$GITHUB_OUTPUT"
        else
          echo "site=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Install elan
      if: steps.mode.outputs.website_only != 'true'
      run: |
        set -o pipefail
        curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
        ./elan-init -y --default-toolchain none
        echo "$HOME/.elan/bin" >> $GITHUB_PATH
    - name: Restore ~/.cache/mathlib
      if: steps.mode.outputs.website_only != 'true'
      uses: actions/cache/restore@6f8efc29b200d32929f49075959781ed54ec270c
      with:
        path: "~/.cache/mathlib"
        key: boundary-20260909-oleans-${{ hashFiles('lean-toolchain', 'lake-manifest.json')
          }}
        restore-keys: 'boundary-20260909-oleans-${{ hashFiles(''lean-toolchain'')
          }}-

'
    - name: Get olean cache
      if: steps.mode.outputs.website_only != 'true'
      run: |
        lake exe cache unpack
        lake exe cache get
    - name: Restore existing cache for seed
      if: inputs.mode == 'seed'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          .lake/build
          docbuild/.lake/build
          _literate_html
        key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json',
          'docbuild/lake-manifest.json', 'docbuild/lakefile.toml') }}-${{ github.sha
          }}
        restore-keys: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain',
          'lake-manifest.json', 'docbuild/lake-manifest.json', 'docbuild/lakefile.toml')
          }}-
    - name: Restore cache saved after documentation
      if: inputs.mode == 'baseline'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          .lake/build
          docbuild/.lake/build
          _literate_html
        key: boundary-20260909-after-docs-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'docbuild/lake-manifest.json',
          'docbuild/lakefile.toml') }}-${{ github.sha }}
        fail-on-cache-miss: true
    - name: Restore Lean build
      if: inputs.mode == 'fixed'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ".lake/build\n"
        key: boundary-20260909-lean-build-v3-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{
          github.sha }}
        fail-on-cache-miss: true
    - name: Edit one problem
      if: inputs.mode != 'seed'
      run: |
        python3 - <<'PYCODE'
        from pathlib import Path
        p = Path('FormalConjectures/ErdosProblems/566.lean')
        s = p.read_text()
        old = '# Erdős Problem 566'
        assert s.count(old) == 1
        p.write_text(s.replace(old, old + ' (cache boundary benchmark)', 1))
        PYCODE
    - name: Generate FormalConjecturesForMathlib.lean
      if: steps.mode.outputs.website_only != 'true'
      run: "./scripts/mk_all_formathlib.sh\n"
    - name: Generate All.lean
      if: steps.mode.outputs.website_only != 'true'
      run: |
        rm -f FormalConjectures/All.lean
        lake exe mk_all --lib FormalConjectures || true
        mv FormalConjectures.lean FormalConjectures/All.lean
        echo "set_option linter.style.moduleDocstring false" >> FormalConjectures/All.lean
    - name: Begin Lean problem matcher
      if: steps.mode.outputs.website_only != 'true'
      uses: leanprover-community/gh-problem-matcher-wrap@65a654fcdf7b64ff7633bc7a558f7b46d59a27bf
      with:
        action: add
        linters: lean
    - name: Build ForMathlib, utilities, and test
      if: steps.mode.outputs.website_only != 'true'
      run: |
        python3 scripts/lake-build-wrapper.py /tmp/build_summary_formathlib.json lake --wfail build FormalConjecturesForMathlib FormalConjecturesUtil
        lake --wfail test
    - name: Build problems
      if: steps.mode.outputs.website_only != 'true'
      run: |
        python3 scripts/lake-build-wrapper.py /tmp/build_summary_problems.json lake --wfail build
        rm -f FormalConjectures/All.lean
    - name: End Lean problem matcher
      if: always() && steps.mode.outputs.website_only != 'true'
      uses: leanprover-community/gh-problem-matcher-wrap@65a654fcdf7b64ff7633bc7a558f7b46d59a27bf
      with:
        action: remove
        linters: lean
    - name: Record before documentation traces
      if: inputs.mode == 'seed'
      run: |
        python3 - <<'PYCODE'
        from pathlib import Path
        import hashlib, json
        root = Path('.lake/build')
        data = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                for p in root.rglob('*.trace') if '/FormalConjectures/' in str(p)}
        Path('/tmp/before-docs-traces.json').write_text(json.dumps(data, sort_keys=True))
        PYCODE
    - name: Save Lean build
      if: steps.mode.outputs.website_only != 'true' && inputs.mode == 'seed'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ".lake/build\n"
        key: boundary-20260909-lean-build-v3-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{
          github.sha }}
    - name: Initialize documentation workspace
      if: steps.mode.outputs.website_only != 'true' && steps.mode.outputs.site ==
        'true'
      working-directory: docbuild
      run: lake env lean --version
    - name: Restore documentation tools
      if: steps.mode.outputs.website_only != 'true' && steps.mode.outputs.site ==
        'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          .lake/packages/verso/.lake/build
          .lake/packages/subverso/.lake/build
          .lake/packages/MD4Lean/.lake/build
          .lake/packages/illuminate/.lake/build
          .lake/packages/plausible/.lake/build
        key: boundary-20260909-doc-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lake-manifest.json',
          'docbuild/lakefile.toml') }}
    - name: Restore literate data
      if: steps.mode.outputs.website_only != 'true' && steps.mode.outputs.site ==
        'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: 'docbuild/.lake/build

'
        key: boundary-20260909-literate-build-v3-${{ runner.os }}-${{ runner.arch
          }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml',
          'docbuild/lake-manifest.json', 'docbuild/lakefile.toml') }}-${{ github.sha
          }}
        restore-keys: 'boundary-20260909-literate-build-v3-${{ runner.os }}-${{ runner.arch
          }}-${{ hashFiles(''lean-toolchain'', ''lake-manifest.json'', ''lakefile.toml'',
          ''docbuild/lake-manifest.json'', ''docbuild/lakefile.toml'') }}-

'
    - name: Build literate source pages
      if: steps.mode.outputs.website_only != 'true' && steps.mode.outputs.site ==
        'true'
      run: |
        cd docbuild
        lake build FormalConjectures:literate \
          FormalConjecturesForMathlib:literate \
          FormalConjecturesUtil:literate
        lake exe verso-html .lake/build/literate ../_literate_html
    - name: Post-process literate HTML
      if: steps.mode.outputs.website_only != 'true' && steps.mode.outputs.site ==
        'true'
      run: 'python3 site/fix_literate_html.py _literate_html

'
    - name: Record after documentation traces
      if: inputs.mode == 'seed'
      run: |
        python3 - <<'PYCODE'
        from pathlib import Path
        import hashlib, json
        root = Path('.lake/build')
        data = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                for p in root.rglob('*.trace') if '/FormalConjectures/' in str(p)}
        Path('/tmp/after-docs-traces.json').write_text(json.dumps(data, sort_keys=True))
        PYCODE
    - name: Save baseline cache after documentation
      if: inputs.mode == 'seed'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          .lake/build
          docbuild/.lake/build
          _literate_html
        key: boundary-20260909-after-docs-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'docbuild/lake-manifest.json',
          'docbuild/lakefile.toml') }}-${{ github.sha }}
    - name: Save documentation tools
      if: steps.mode.outputs.website_only != 'true' && steps.mode.outputs.site ==
        'true' && inputs.mode == 'seed'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          .lake/packages/verso/.lake/build
          .lake/packages/subverso/.lake/build
          .lake/packages/MD4Lean/.lake/build
          .lake/packages/illuminate/.lake/build
          .lake/packages/plausible/.lake/build
        key: boundary-20260909-doc-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lake-manifest.json',
          'docbuild/lakefile.toml') }}
    - name: Save literate data
      if: steps.mode.outputs.website_only != 'true' && steps.mode.outputs.site ==
        'true' && inputs.mode == 'seed'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: 'docbuild/.lake/build

'
        key: boundary-20260909-literate-build-v3-${{ runner.os }}-${{ runner.arch
          }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml',
          'docbuild/lake-manifest.json', 'docbuild/lakefile.toml') }}-${{ github.sha
          }}
    - name: Pack olean cache
      if: steps.mode.outputs.website_only != 'true' && inputs.mode == 'seed'
      run: |
        lake exe cache pack
        ls ~/.cache/mathlib
    - name: Save ~/.cache/mathlib
      if: steps.mode.outputs.website_only != 'true' && inputs.mode == 'seed'
      uses: actions/cache/save@6f8efc29b200d32929f49075959781ed54ec270c
      with:
        path: "~/.cache/mathlib"
        key: boundary-20260909-oleans-${{ hashFiles('lean-toolchain', 'lake-manifest.json')
          }}
    - name: Set up Python
      if: steps.mode.outputs.website_only != 'true'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: 3.12.9
    - name: Install Python dependencies
      if: steps.mode.outputs.website_only != 'true' && steps.mode.outputs.site ==
        'true'
      run: |
        python -m pip install --upgrade pip
        pip install pandas==2.2.3 numpy==2.2.3 plotly==5.20.0 beautifulsoup4 lxml
    - name: Run plotting script
      if: steps.mode.outputs.website_only != 'true' && steps.mode.outputs.site ==
        'true'
      run: |
        mkdir -p site/data
        python site/plot_growth.py
    - name: Set up Node.js
      if: steps.mode.outputs.site == 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '18'
    - name: Generate conjectures data for website
      if: steps.mode.outputs.website_only != 'true'
      run: |
        mkdir -p site/data
        lake exe extract_names --exclude=statement,docstring,moduleDocstrings,fileFirstAdded,fileLastModified \
          > site/data/conjectures.json
    - name: Check category warnings
      if: steps.mode.outputs.website_only != 'true'
      run: python3 scripts/check_category_warnings.py site/data/conjectures.json
    - name: Extract Verso fragments for website
      if: steps.mode.outputs.website_only != 'true' && steps.mode.outputs.site ==
        'true'
      run: 'python3 site/extract_verso_fragments.py _literate_html site/data/verso-fragments.json

'
    - name: Download live site data
      if: steps.mode.outputs.website_only == 'true'
      run: |
        LIVE_URL="https://google-deepmind.github.io/formal-conjectures"
        mkdir -p site/data _literate_html
        echo "Downloading conjectures data from $LIVE_URL ..."
        curl -sfL "$LIVE_URL/data/conjectures.json" -o /tmp/live_conjectures.json
        echo "Downloading growth plots from $LIVE_URL ..."
        curl -sfL "$LIVE_URL/data/file_counts_white.html" -o site/data/file_counts_white.html || true
        curl -sfL "$LIVE_URL/data/file_counts_dark.html" -o site/data/file_counts_dark.html || true
        node -e "
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/live_conjectures.json', 'utf8'));

          // Convert processed conjectures back to raw extract_names format
          const problems = (data.conjectures || []).map(c => ({
            theorem: c.theorem,
            module: c.module,
            category: c.category,
            subjects: (c.subjects || []).map(s =>
              typeof s === 'object' ? s.code : s
            ),
            formalProofs: c.formalProofs || [],
            hasSorryFreeProof: false,
          }));
          fs.writeFileSync(
            'site/data/conjectures.json',
            JSON.stringify({ problems })
          );

          // Extract Verso fragments if present
          if (data.versoFragments) {
            fs.writeFileSync(
              'site/data/verso-fragments.json',
              JSON.stringify(data.versoFragments)
            );
          }
          console.log('Converted ' + problems.length + ' conjectures to raw format.');
        "
    - name: Build website
      if: steps.mode.outputs.site == 'true'
      run: |
        cd site
        node build.js
      env:
        BASE_PATH: "/formal-conjectures"
        GITHUB_TOKEN: "${{ github.token }}"
    - name: Assemble deploy artifact
      if: steps.mode.outputs.site == 'true'
      run: |
        mkdir -p _deploy
        # Website goes at root
        cp -r site/site/* _deploy/
        # Literate source pages go under /src (may not exist in website-only mode)
        if [[ -d _literate_html ]] && [[ -n "$(ls -A _literate_html 2>/dev/null)" ]]; then
          cp -r _literate_html _deploy/src
        fi
    - name: Upload deploy artifact
      id: deployment
      if: steps.mode.outputs.site == 'true'
      uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
      with:
        path: _deploy
    - name: Upload trace comparison
      if: inputs.mode == 'seed'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: cache-boundary-traces
        path: |-
          /tmp/before-docs-traces.json
          /tmp/after-docs-traces.json
        retention-days: 7
        if-no-files-found: error
        overwrite: true
run-name: Cache boundary / ${{ inputs.mode }}
'on':
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options:
        - seed
        - baseline
        - fixed
        default: seed
        description: Seed both caches, or time the same one-problem edit against either
          cache
