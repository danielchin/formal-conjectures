name: Benchmark Lean feedback
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: Benchmark case
        type: choice
        required: true
        default: seed
        options:
          - seed
          - baseline-pass
          - fixed-pass
          - baseline-fail
          - fixed-fail
permissions:
  contents: read
concurrency:
  group: feedback-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  scripts:
    runs-on: ubuntu-latest
    name: Test scripts
    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.12.9
      - name: Run script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Run website post-processing tests
        run: python3 -m unittest discover -s site -p 'test_*.py' -v
  build:
    runs-on: ubuntu-latest
    name: Build project
    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect build mode
        id: mode
        run: |
          echo "website_only=false" >> "$GITHUB_OUTPUT"
          echo "site=false" >> "$GITHUB_OUTPUT"
      - name: Install elan
        if: steps.mode.outputs.website_only != 'true'
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Restore prepared Lean environment
        id: lean-env
        if: startsWith(inputs.mode, 'fixed-')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.elan/toolchains
            .lake/packages
          key: feedback-20260910-lean-env-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Restore ~/.cache/mathlib
        if: startsWith(inputs.mode, 'baseline-')
        uses: actions/cache/restore@6f8efc29b200d32929f49075959781ed54ec270c
        with:
          path: ~/.cache/mathlib
          key: feedback-20260910-oleans-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Get olean cache
        if: inputs.mode == 'seed' || startsWith(inputs.mode, 'baseline-')
        run: |
          lake exe cache unpack
          lake exe cache get
      - name: Restore Lean build
        if: inputs.mode != 'seed'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build
          key: feedback-20260910-lean-build-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Apply benchmark change
        if: inputs.mode != 'seed'
        env:
          BENCHMARK_MODE: ${{ inputs.mode }}
        run: "python3 - <<'PYEDIT'\nimport os\nfrom pathlib import Path\np = Path('FormalConjectures/ErdosProblems/566.lean')\ns = p.read_text()\nassert s.count('# Erd\u0151s Problem 566') == 1\ns = s.replace('# Erd\u0151s Problem 566', '# Erd\u0151s Problem 566 (feedback benchmark)')\nif os.environ['BENCHMARK_MODE'].endswith('-fail'):\n    s += '\\n#check feedback_benchmark_intentionally_undefined\\n'\np.write_text(s)\nPYEDIT\n"
      - name: Generate FormalConjecturesForMathlib.lean
        if: steps.mode.outputs.website_only != 'true'
        run: |
          ./scripts/mk_all_formathlib.sh
      - name: Generate All.lean
        if: steps.mode.outputs.website_only != 'true'
        run: |
          rm -f FormalConjectures/All.lean
          lake exe mk_all --lib FormalConjectures || true
          mv FormalConjectures.lean FormalConjectures/All.lean
          echo "set_option linter.style.moduleDocstring false" >> FormalConjectures/All.lean
      - name: Begin Lean problem matcher
        if: steps.mode.outputs.website_only != 'true'
        uses: leanprover-community/gh-problem-matcher-wrap@65a654fcdf7b64ff7633bc7a558f7b46d59a27bf
        with:
          action: add
          linters: lean
      - name: Build ForMathlib, utilities, and test
        if: steps.mode.outputs.website_only != 'true'
        run: |
          python3 scripts/lake-build-wrapper.py /tmp/build_summary_formathlib.json lake --wfail build FormalConjecturesForMathlib FormalConjecturesUtil
          lake --wfail test
      - name: Build problems
        if: steps.mode.outputs.website_only != 'true'
        run: |
          /usr/bin/time -v python3 scripts/lake-build-wrapper.py /tmp/build_summary_problems.json lake --wfail build
          rm -f FormalConjectures/All.lean
      - name: End Lean problem matcher
        if: always() && steps.mode.outputs.website_only != 'true'
        uses: leanprover-community/gh-problem-matcher-wrap@65a654fcdf7b64ff7633bc7a558f7b46d59a27bf
        with:
          action: remove
          linters: lean
      - name: Set up Python
        if: steps.mode.outputs.website_only != 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.12.9
      - name: Extract conjecture metadata
        if: steps.mode.outputs.website_only != 'true'
        run: |
          mkdir -p site/data
          lake exe extract_names --exclude=statement,docstring,moduleDocstrings,fileFirstAdded,fileLastModified \
            > site/data/conjectures.json
      - name: Check category warnings
        if: steps.mode.outputs.website_only != 'true'
        run: python3 scripts/check_category_warnings.py site/data/conjectures.json
      - name: Save Lean build
        if: inputs.mode == 'seed'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build
          key: feedback-20260910-lean-build-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
      - name: Save prepared Lean environment
        if: inputs.mode == 'seed'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.elan/toolchains
            .lake/packages
          key: feedback-20260910-lean-env-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
      - name: Save benchmark Mathlib download cache
        if: inputs.mode == 'seed'
        uses: actions/cache/save@6f8efc29b200d32929f49075959781ed54ec270c
        with:
          path: ~/.cache/mathlib
          key: feedback-20260910-oleans-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
run-name: Lean feedback / ${{ inputs.mode }}
