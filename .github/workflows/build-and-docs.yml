# Benchmark only: no deployment or production workflow changes.
name: Benchmark Lean build shards
run-name: Lean benchmark / ${{ inputs.shards }} shards / cache=${{ inputs.use_cache }}
on:
  workflow_dispatch:
    inputs:
      shards:
        type: choice
        options: ['1', '4']
        default: '4'
        description: Number of problem build jobs
      use_cache:
        type: boolean
        default: false
        description: Restore the preceding successful cold run's project cache
permissions:
  contents: read
jobs:
  single:
    name: Single-job Lean validation
    if: inputs.shards == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Get Mathlib cache
        run: lake exe cache get
      - name: Restore project cache
        if: inputs.use_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lean-shards-bench-20260909-${{ inputs.shards }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Generate import aggregates
        run: |
          ./scripts/mk_all_formathlib.sh
          rm -f FormalConjectures/All.lean
          lake exe mk_all --lib FormalConjectures || true
          mv FormalConjectures.lean FormalConjectures/All.lean
          echo "set_option linter.style.moduleDocstring false" >> FormalConjectures/All.lean
      - name: Build shared libraries and tests
        run: |
          python3 scripts/lake-build-wrapper.py /tmp/shared.json lake --wfail build FormalConjecturesForMathlib FormalConjecturesUtil
          lake --wfail test
      - name: Validate all problems and declaration collisions
        run: python3 scripts/lake-build-wrapper.py /tmp/problems.json lake --wfail build
      - name: Validate categories
        run: |
          rm -f FormalConjectures/All.lean
          mkdir -p site/data
          lake exe extract_names --exclude=statement,docstring,moduleDocstrings,fileFirstAdded,fileLastModified > site/data/conjectures.json
          python3 scripts/check_category_warnings.py site/data/conjectures.json
      - name: Save validated project cache
        if: '!inputs.use_cache'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lean-shards-bench-20260909-${{ inputs.shards }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
  prepare:
    name: Build shared libraries
    if: inputs.shards == '4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Get Mathlib cache
        run: lake exe cache get
      - name: Restore project cache
        if: inputs.use_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lean-shards-bench-20260909-${{ inputs.shards }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Generate import aggregates
        run: |
          ./scripts/mk_all_formathlib.sh
          rm -f FormalConjectures/All.lean
          lake exe mk_all --lib FormalConjectures || true
          mv FormalConjectures.lean FormalConjectures/All.lean
          echo "set_option linter.style.moduleDocstring false" >> FormalConjectures/All.lean
      - name: Build shared libraries and tests
        run: |
          python3 scripts/lake-build-wrapper.py /tmp/shared.json lake --wfail build FormalConjecturesForMathlib FormalConjecturesUtil
          lake --wfail test
      - name: Test shard assignment
        run: python3 -m unittest discover -s scripts -p test_ci_shards.py -v
      - name: Package shared build
        run: tar -cf /tmp/build.tar .lake/build FormalConjecturesForMathlib.lean FormalConjectures/All.lean
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-lean-build
          path: /tmp/build.tar
          compression-level: 1
          retention-days: 7
          if-no-files-found: error
          overwrite: true
  problems:
    name: Problem shard ${{ matrix.shard }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Get Mathlib cache
        run: lake exe cache get
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shared-lean-build
          path: /tmp/shared
      - name: Unpack shared build
        run: tar -xf /tmp/shared/build.tar
      - name: Build problem shard
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/ci_shards.py --count 4 --index "$SHARD"
      - name: Package compiled problems
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import tarfile
          with tarfile.open('/tmp/problems.tar', 'w') as archive:
              for path in sorted(Path('.lake/build').rglob('FormalConjectures')):
                  if path.is_dir():
                      archive.add(path, arcname=str(path))
          PYCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: problem-shard-${{ matrix.shard }}
          path: /tmp/problems.tar
          compression-level: 1
          retention-days: 7
          if-no-files-found: error
          overwrite: true
  validate:
    name: Validate combined Lean build
    needs: [prepare, problems]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Get Mathlib cache
        run: lake exe cache get
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shared-lean-build
          path: /tmp/shared
      - name: Unpack shared build
        run: tar -xf /tmp/shared/build.tar
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: problem-shard-*
          path: /tmp/problem-shards
      - name: Combine problem artifacts
        run: |
          for shard in 0 1 2 3; do
            tar -xf "/tmp/problem-shards/problem-shard-$shard/problems.tar"
          done
      - name: Validate all problems and declaration collisions
        run: python3 scripts/lake-build-wrapper.py /tmp/problems.json lake --wfail build
      - name: Validate categories
        run: |
          rm -f FormalConjectures/All.lean
          mkdir -p site/data
          lake exe extract_names --exclude=statement,docstring,moduleDocstrings,fileFirstAdded,fileLastModified > site/data/conjectures.json
          python3 scripts/check_category_warnings.py site/data/conjectures.json
      - name: Save validated project cache
        if: '!inputs.use_cache'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lean-shards-bench-20260909-${{ inputs.shards }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
