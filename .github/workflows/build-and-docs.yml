name: Build Lean project and deploy docs
'on':
  push:
    branches:
      - main
      - '*-webtest'
  pull_request: null
  merge_group: null
  workflow_dispatch:
    inputs:
      website_only:
        description: Skip Lean build and use live site data (for website development)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scripts:
    runs-on: ubuntu-latest
    name: Test scripts
    steps:

      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.9

      - name: Run script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Run website post-processing tests
        run: python3 -m unittest discover -s site -p 'test_*.py' -v
  # Keep this check name for existing branch protection. It validates Lean only.
  build:
    runs-on: ubuntu-latest
    name: Build project
    outputs:
      site: ${{ steps.mode.outputs.site }}
      website_only: ${{ steps.mode.outputs.website_only }}
    steps:

      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect build mode
        id: mode
        env:
          WEBSITE_ONLY: ${{ inputs.website_only }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$WEBSITE_ONLY" == "true" ]] || \
             [[ "$REF_NAME" == *-webtest ]]; then
            echo "website_only=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Website-only build: skipping Lean compilation, downloading data from live site."
          else
            echo "website_only=false" >> "$GITHUB_OUTPUT"
          fi

          site=true
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # A pull request is checked out as a merge commit, so HEAD^1 is the
            # base and this diff is exactly what the pull request changes. If
            # that fails for any reason, fall back to building the site.
            touched=$(git diff --name-only HEAD^1 HEAD -- \
              site docbuild .github/workflows/build-and-docs.yml 2>/dev/null || echo unknown)
            if [[ -z "$touched" ]]; then
              site=false
              echo "::notice::Pull request leaves the site untouched: validating Lean only."
            else
              echo "::notice::Pull request touches the site, building it."
            fi
          fi
          echo "site=$site" >> "$GITHUB_OUTPUT"

      - name: Install elan
        if: steps.mode.outputs.website_only != 'true'
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      # An exact hit includes the compiler, dependency sources and build outputs.
      - name: Restore prepared Lean environment
        id: lean-env
        if: steps.mode.outputs.website_only != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan/toolchains
            .lake/packages
          key: lean-env-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}

      - name: Restore ~/.cache/mathlib
        if: steps.mode.outputs.website_only != 'true' && steps.lean-env.outputs.cache-hit != 'true'
        uses: actions/cache/restore@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: ~/.cache/mathlib
          key: oleans-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            oleans-${{ hashFiles('lean-toolchain') }}-

      - name: Get olean cache
        if: steps.mode.outputs.website_only != 'true' && steps.lean-env.outputs.cache-hit != 'true'
        run: |
          lake exe cache unpack
          lake exe cache get

      - name: Restore Lean build
        if: steps.mode.outputs.website_only != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/build
          key: lean-build-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            lean-build-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - name: Generate FormalConjecturesForMathlib.lean
        if: steps.mode.outputs.website_only != 'true'
        run: |
          ./scripts/mk_all_formathlib.sh

      - name: Generate All.lean
        if: steps.mode.outputs.website_only != 'true'
        run: |
          rm -f FormalConjectures/All.lean
          lake exe mk_all --lib FormalConjectures || true
          mv FormalConjectures.lean FormalConjectures/All.lean
          echo "set_option linter.style.moduleDocstring false" >> FormalConjectures/All.lean

      - name: Begin Lean problem matcher
        if: steps.mode.outputs.website_only != 'true'
        uses: leanprover-community/gh-problem-matcher-wrap@65a654fcdf7b64ff7633bc7a558f7b46d59a27bf # master
        with:
          action: add
          linters: lean

      - name: Build ForMathlib, utilities, and test
        if: steps.mode.outputs.website_only != 'true'
        run: |
          python3 scripts/lake-build-wrapper.py /tmp/build_summary_formathlib.json lake --wfail build FormalConjecturesForMathlib FormalConjecturesUtil
          lake --wfail test

      - name: Build problems
        if: steps.mode.outputs.website_only != 'true'
        run: |
          python3 scripts/lake-build-wrapper.py /tmp/build_summary_problems.json lake --wfail build
          rm -f FormalConjectures/All.lean

      - name: End Lean problem matcher
        if: always() && steps.mode.outputs.website_only != 'true'
        uses: leanprover-community/gh-problem-matcher-wrap@65a654fcdf7b64ff7633bc7a558f7b46d59a27bf # master
        with:
          action: remove
          linters: lean

      - name: Set up Python
        if: steps.mode.outputs.website_only != 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.9

      - name: Extract conjecture metadata
        if: steps.mode.outputs.website_only != 'true'
        run: |
          mkdir -p site/data
          lake exe extract_names --exclude=statement,docstring,moduleDocstrings,fileFirstAdded,fileLastModified \
            > site/data/conjectures.json

      - name: Check category warnings
        if: steps.mode.outputs.website_only != 'true'
        run: python3 scripts/check_category_warnings.py site/data/conjectures.json

      # Save after metadata extraction so its executable is reusable too.
      # Documentation runs on a separate runner and cannot modify this cache.
      - name: Save Lean build
        if: steps.mode.outputs.website_only != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/build
          key: lean-build-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}

      - name: Save prepared Lean environment
        if: steps.mode.outputs.website_only != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.lean-env.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan/toolchains
            .lake/packages
          key: lean-env-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}

  # Documentation failure has its own status and does not delay the Lean result.
  docs:
    runs-on: ubuntu-latest
    name: Build documentation
    needs: build
    if: needs.build.outputs.site == 'true'
    steps:

      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install elan
        if: needs.build.outputs.website_only != 'true'
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      # An exact hit includes the compiler, dependency sources and build outputs.
      - name: Restore prepared Lean environment
        id: lean-env
        if: needs.build.outputs.website_only != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan/toolchains
            .lake/packages
          key: lean-env-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}

      - name: Restore ~/.cache/mathlib
        if: needs.build.outputs.website_only != 'true' && steps.lean-env.outputs.cache-hit != 'true'
        uses: actions/cache/restore@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: ~/.cache/mathlib
          key: oleans-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            oleans-${{ hashFiles('lean-toolchain') }}-

      - name: Get olean cache
        if: needs.build.outputs.website_only != 'true' && steps.lean-env.outputs.cache-hit != 'true'
        run: |
          lake exe cache unpack
          lake exe cache get

      - name: Restore Lean build
        if: needs.build.outputs.website_only != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/build
          key: lean-build-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            lean-build-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - name: Generate FormalConjecturesForMathlib.lean
        if: needs.build.outputs.website_only != 'true'
        run: |
          ./scripts/mk_all_formathlib.sh

      - name: Initialize documentation workspace
        if: needs.build.outputs.website_only != 'true' && needs.build.outputs.site == 'true'
        working-directory: docbuild
        run: lake env lean --version

      - name: Restore documentation tools
        if: needs.build.outputs.website_only != 'true' && needs.build.outputs.site == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/packages/verso/.lake/build
            .lake/packages/subverso/.lake/build
            .lake/packages/MD4Lean/.lake/build
            .lake/packages/illuminate/.lake/build
            .lake/packages/plausible/.lake/build
          key: doc-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lake-manifest.json', 'docbuild/lakefile.toml') }}

      - name: Restore literate data
        if: needs.build.outputs.website_only != 'true' && needs.build.outputs.site == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            docbuild/.lake/build
          key: literate-build-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'docbuild/lake-manifest.json', 'docbuild/lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            literate-build-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'docbuild/lake-manifest.json', 'docbuild/lakefile.toml') }}-

      - name: Build literate source pages
        if: needs.build.outputs.website_only != 'true' && needs.build.outputs.site == 'true'
        run: |
          cd docbuild
          lake build FormalConjectures:literate \
            FormalConjecturesForMathlib:literate \
            FormalConjecturesUtil:literate
          lake exe verso-html .lake/build/literate ../_literate_html

      - name: Post-process literate HTML
        if: needs.build.outputs.website_only != 'true' && needs.build.outputs.site == 'true'
        run: |
          python3 site/fix_literate_html.py _literate_html

      - name: Save documentation tools
        if: needs.build.outputs.website_only != 'true' && needs.build.outputs.site == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/packages/verso/.lake/build
            .lake/packages/subverso/.lake/build
            .lake/packages/MD4Lean/.lake/build
            .lake/packages/illuminate/.lake/build
            .lake/packages/plausible/.lake/build
          key: doc-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lake-manifest.json', 'docbuild/lakefile.toml') }}

      - name: Save literate data
        if: needs.build.outputs.website_only != 'true' && needs.build.outputs.site == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            docbuild/.lake/build
          key: literate-build-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'docbuild/lake-manifest.json', 'docbuild/lakefile.toml') }}-${{ github.sha }}

      - name: Set up Python
        if: needs.build.outputs.website_only != 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.9

      - name: Install Python dependencies
        if: needs.build.outputs.website_only != 'true' && needs.build.outputs.site == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.3 numpy==2.2.3 plotly==5.20.0 beautifulsoup4 lxml

      - name: Run plotting script
        if: needs.build.outputs.website_only != 'true' && needs.build.outputs.site == 'true'
        run: |
          mkdir -p site/data
          python site/plot_growth.py

      - name: Set up Node.js
        if: needs.build.outputs.site == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '18'

      - name: Generate conjectures data for website
        if: needs.build.outputs.website_only != 'true'
        run: |
          mkdir -p site/data
          lake exe extract_names --exclude=statement,docstring,moduleDocstrings,fileFirstAdded,fileLastModified \
            > site/data/conjectures.json

      - name: Extract Verso fragments for website
        if: needs.build.outputs.website_only != 'true' && needs.build.outputs.site == 'true'
        run: |
          python3 site/extract_verso_fragments.py _literate_html site/data/verso-fragments.json

      - name: Download live site data
        if: needs.build.outputs.website_only == 'true'
        run: |
          LIVE_URL="https://google-deepmind.github.io/formal-conjectures"
          mkdir -p site/data _literate_html
          echo "Downloading conjectures data from $LIVE_URL ..."
          curl -sfL "$LIVE_URL/data/conjectures.json" -o /tmp/live_conjectures.json
          echo "Downloading growth plots from $LIVE_URL ..."
          curl -sfL "$LIVE_URL/data/file_counts_white.html" -o site/data/file_counts_white.html || true
          curl -sfL "$LIVE_URL/data/file_counts_dark.html" -o site/data/file_counts_dark.html || true
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('/tmp/live_conjectures.json', 'utf8'));

            // Convert processed conjectures back to raw extract_names format
            const problems = (data.conjectures || []).map(c => ({
              theorem: c.theorem,
              module: c.module,
              category: c.category,
              subjects: (c.subjects || []).map(s =>
                typeof s === 'object' ? s.code : s
              ),
              formalProofs: c.formalProofs || [],
              hasSorryFreeProof: false,
            }));
            fs.writeFileSync(
              'site/data/conjectures.json',
              JSON.stringify({ problems })
            );

            // Extract Verso fragments if present
            if (data.versoFragments) {
              fs.writeFileSync(
                'site/data/verso-fragments.json',
                JSON.stringify(data.versoFragments)
              );
            }
            console.log('Converted ' + problems.length + ' conjectures to raw format.');
          "

      - name: Build website
        if: needs.build.outputs.site == 'true'
        run: |
          cd site
          node build.js
        env:
          BASE_PATH: /formal-conjectures
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assemble deploy artifact
        if: needs.build.outputs.site == 'true'
        run: |
          mkdir -p _deploy
          # Website goes at root
          cp -r site/site/* _deploy/
          # Literate source pages go under /src (may not exist in website-only mode)
          if [[ -d _literate_html ]] && [[ -n "$(ls -A _literate_html 2>/dev/null)" ]]; then
            cp -r _literate_html _deploy/src
          fi

      - name: Upload deploy artifact
        id: deployment
        if: needs.build.outputs.site == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _deploy
  deploy:
    if: |-
      github.ref == 'refs/heads/main' || (github.repository != 'google-deepmind/formal-conjectures' &&
       endsWith(github.ref_name, '-webtest'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs:
      - build
      - docs
      - scripts
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
